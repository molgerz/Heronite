# A test AppImage of the community layer (not for Heronite itself): this
# branch is feat/community-profile plus this file. Built like the release
# job, without update information, so no AppImage updater replaces it with
# the official release, and published as a numbered pre-release
# ("Heronite Nostr test build N", Heronite-Nostr-x86_64.AppImage), never marked as the latest release.
name: Test AppImage

on:
  push:
    branches: [dev/nostr-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-appimage
  cancel-in-progress: false

jobs:
  appimage:
    name: AppImage (x86_64)
    # The oldest supported Ubuntu, as for releases: runs on glibc 2.35+ (SteamOS has newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: scripts/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p heronite -p heronite-epic-login
      - name: appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          sudo apt-get install -y --no-install-recommends patchelf bison ninja-build
          pipx install 'meson>=1.4'
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          UPDATE_INFO: ""
        run: scripts/appimage.sh
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(( $(gh release list --limit 1000 --json tagName --jq '[.[] | select(.tagName | startswith("heronite-nostr-test-"))] | length') + 1 ))
          base=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cp dist/Heronite-x86_64.AppImage dist/Heronite-Nostr-x86_64.AppImage
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          A test build of the **optional community layer on Nostr**, an early draft for [discussion #252](https://github.com/RafaelGoulartB/Heronite/discussions/252). Not an official Heronite release and not finished: expect rough edges, and feedback is very welcome.

          Based on Heronite ${base}, commit \`${GITHUB_SHA::8}\`. Linux x86_64 (also Steam Deck, in Desktop Mode). The AppImage has no update information, so it never replaces an installed official Heronite.

          **Try it without touching your library**, with a data folder of its own:

          \`\`\`
          chmod +x Heronite-Nostr-x86_64.AppImage
          HERONITE_DATA_DIR=~/heronite-test1 ./Heronite-Nostr-x86_64.AppImage
          \`\`\`

          Then turn it on in **Settings → Community**. To try friends, chats and "playing" alone, start a second one with another folder (\`HERONITE_DATA_DIR=~/heronite-test2\`) and add each other's npub, or add a Nostr app on your phone as a friend.
          EOF
          gh release create "heronite-nostr-test-$n" dist/Heronite-Nostr-x86_64.AppImage \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Heronite Nostr test build $n" --notes-file "$RUNNER_TEMP/notes.md"
